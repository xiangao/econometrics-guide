on:
  push:
    branches: [master]

name: Quarto Publish

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys the pre-rendered _book/ committed to master. The book uses R and
# Stata code chunks; rather than re-executing them on every CI run, we
# render locally and commit _book/ (and _freeze/). CI just uploads and
# deploys.

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
